name: ModernNoCupboardDecay
title: Modern No Cupboard Decay
version: 5.2.0
author: Gabriel
game: rust
modloader: oxide
branch: stable

description: >
  Prevents decay for anything within Tool Cupboard radius. Supports TC auth
  and team-aware protection logic, provides a wipe-aware TC UI, draggable UI
  positioning, live runtime configuration, TC preview holograms, protection
  debugging overlay, multi-language support, and automated wipe-schedule
  detection (weekly / biweekly / monthly / custom N-day).

language: C#
category: building
license: MIT

website: https://github.com/gjdunga/ModernNoCupboardDecay
source: https://github.com/gjdunga/ModernNoCupboardDecay
documentation: https://github.com/gjdunga/ModernNoCupboardDecay#readme

tags:
  - rust
  - oxide
  - umod
  - cupboard
  - decay
  - building
  - debug
  - wipe
  - qol

permissions:
  - name: modernnocupboarddecay.admin
    description: Allows access to all configuration and UI commands.
  - name: modernnocupboarddecay.debug
    description: Allows use of the protection-status debug overlay.
  - name: modernnocupboarddecay.preview
    description: Allows use of /mncdpreview when PreviewRequiresPermission is true.

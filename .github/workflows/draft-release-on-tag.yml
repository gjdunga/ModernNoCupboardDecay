name: Draft release on version tag

on:
  push:
    tags: [ 'v*.*.*', 'V*.*.*' ]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage release assets (lang files get unique, locale-suffixed names)
        run: |
          mkdir -p release-assets
          cp "oxide/plugins/ModernNoCupboardDecay.cs" release-assets/
          for dir in oxide/lang/*/; do
            loc="$(basename "$dir")"
            src="${dir}ModernNoCupboardDecay.json"
            [ -f "$src" ] && cp "$src" "release-assets/ModernNoCupboardDecay-${loc}.json"
          done
          [ -f "oxide/config/ModernNoCupboardDecay.json" ] && cp "oxide/config/ModernNoCupboardDecay.json" "release-assets/ModernNoCupboardDecay-config.json" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Modern No Cupboard Decay ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/ModernNoCupboardDecay.cs
            release-assets/ModernNoCupboardDecay-*.json
